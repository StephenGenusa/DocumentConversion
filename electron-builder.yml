appId: com.docconversion.app
productName: Document Converter
directories:
  buildResources: build
  output: dist
files:
  # An ALLOWLIST, not a denylist.
  #
  # This was previously a list of nothing but negations. electron-builder only
  # replaces its default `**/*` when a POSITIVE pattern is given, so a list of
  # pure exclusions left the default in force and packaged the entire working
  # directory — everything the list did not happen to name. `Test Docs/` (the
  # PII corpus), `.claude/` and `invite0.ics` all shipped inside app.asar of
  # every build made before 2026-09-07. `.gitignore` has no bearing here:
  # electron-builder does not read it.
  #
  # Name what the app needs; nothing else can leak in by omission.
  - 'out/**'
  # Under out/ but not the app: out/e2e is the e2e matrix's own bundle of core
  # (npm run build:e2e-core, loaded only by tests/e2e/matrix.cjs), and
  # out/bundled-packages is the build's record of what each bundle inlined,
  # read only by scripts/build-notices.mjs (its result is resources/notices).
  - '!out/e2e/**'
  - '!out/bundled-packages/**'
  - 'resources/**'
  - 'package.json'
  - 'node_modules/**'
  - '!**/*.map'
  - '!**/.vscode/*'
  - '!**/*.log'
asarUnpack:
  - resources/**
  # tesseract's worker_threads scripts and wasm core cannot load from asar
  # The sqlite worker is started by Node from a real file (sqlite-host.ts);
  # its engine, resources/sqlite, is already unpacked by resources/** above.
  - out/main/sqlite-worker.js
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@napi-rs/canvas/**
  # pdfjs' fake worker is ESM-imported by file URL — must be a real file
  - node_modules/pdfjs-dist/**
extraResources:
  # offline OCR language data -> <resourcesPath>/ocr at runtime
  - from: resources/ocr
    to: ocr
  # console launcher stub for the CLI -> <install>\resources\cli\docconv.cmd
  - from: scripts/cli
    to: cli
win:
  executableName: DocumentConverter
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# No `target` here: scripts/build/build-macos.sh (on a Mac) asks for dmg and
# zip, x64 and arm64; npm run build:mac (cross-built on Linux) for an x64 zip.
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # The Dock icon only accepts a dropped file of a type named here, and Finder
  # offers the app under Open With for the same. Viewer and Alternate: the app
  # never asks to be the default for a .docx or a .pdf. Documents only; source
  # code (80-odd extensions) and most pictures still open by dropping them on
  # the window. The app receives these as `open-file` (src/main/index.ts).
  fileAssociations:
    - { name: Word document, ext: [docx, docm, doc], role: Viewer, rank: Alternate }
    - { name: PDF document, ext: pdf, role: Viewer, rank: Alternate }
    - { name: Rich Text document, ext: rtf, role: Viewer, rank: Alternate }
    - { name: OpenDocument, ext: [odt, ods, odp], role: Viewer, rank: Alternate }
    - { name: Spreadsheet, ext: [xlsx, xls, csv, tsv], role: Viewer, rank: Alternate }
    - { name: Presentation, ext: [pptx, pptm], role: Viewer, rank: Alternate }
    - { name: E-book, ext: epub, role: Viewer, rank: Alternate }
    - { name: Web page, ext: [html, htm], role: Viewer, rank: Alternate }
    - { name: Markdown document, ext: [md, markdown, mdown, mkd, mkdn, mdwn, markdn, rmd, qmd], role: Viewer, rank: Alternate }
    - { name: Text document, ext: [txt, text], role: Viewer, rank: Alternate }
    - { name: Markup document, ext: [adoc, asciidoc, asc, rst, djot, dj, textile, opml], role: Viewer, rank: Alternate }
    - { name: Email message, ext: [eml, msg, mbox], role: Viewer, rank: Alternate }
    - { name: Calendar or contact, ext: [ics, ical, vcf, vcard], role: Viewer, rank: Alternate }
    - { name: Notebook, ext: ipynb, role: Viewer, rank: Alternate }
    - { name: Subtitles, ext: [vtt, srt], role: Viewer, rank: Alternate }
    - { name: Drawing, ext: [svg, emf, wmf], role: Viewer, rank: Alternate }
    - { name: Scanned page, ext: [tif, tiff], role: Viewer, rank: Alternate }
    - { name: Data file, ext: [json, jsonl, ndjson, sqlite, sqlite3, db3], role: Viewer, rank: Alternate }
linux:
  icon: build/icon.png
  # Names the .desktop entry after `desktopName` in package.json and writes a
  # matching StartupWMClass. Without it the entry claimed
  # `StartupWMClass=Document Converter` while the window's real WM_CLASS was
  # `docconversion`, so no desktop environment could tie a running window to
  # its launcher: no icon highlight, no window grouping, a duplicate entry in
  # the dock. Verified with `xprop WM_CLASS` on the packaged build.
  syncDesktopName: true
  # MimeType= in the .desktop entry, so a dock accepts these dropped on the
  # icon and file managers offer the app under Open With; Exec already ends in
  # %U. `mimeTypes`, not `fileAssociations`: the latter also writes a
  # shared-mime-info definition of each type, redefining application/pdf and
  # the rest. Listing a type does not make the app its default. Takes effect
  # once the AppImage is integrated into the desktop (AppImageLauncher and the
  # like). Same documents as mac.fileAssociations above.
  mimeTypes:
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.ms-word.document.macroEnabled.12
    - application/msword
    - application/pdf
    - application/rtf
    - text/rtf
    - application/vnd.oasis.opendocument.text
    - application/vnd.oasis.opendocument.spreadsheet
    - application/vnd.oasis.opendocument.presentation
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - application/vnd.ms-excel
    - text/csv
    - text/tab-separated-values
    - application/vnd.openxmlformats-officedocument.presentationml.presentation
    - application/vnd.ms-powerpoint.presentation.macroEnabled.12
    - application/epub+zip
    - text/html
    - text/markdown
    - text/x-markdown
    - text/plain
    - text/asciidoc
    - text/x-rst
    - text/x-opml+xml
    - message/rfc822
    - application/vnd.ms-outlook
    - application/mbox
    - text/calendar
    - text/vcard
    - text/x-vcard
    - application/x-ipynb+json
    - text/vtt
    - application/x-subrip
    - image/svg+xml
    - image/emf
    - image/wmf
    - image/x-emf
    - image/x-wmf
    - image/tiff
    - application/json
    - application/x-ndjson
    - application/vnd.sqlite3
    - application/x-sqlite3
  target:
    - AppImage
  maintainer: electronjs.org
  category: Office
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Explicitly null, not absent. Nothing in src/ uses electron-updater or any
# other updater, and any publish configuration makes electron-builder write an
# app-update.yml into the package pointing at it. Leaving the key out was
# meant to prevent that and did not: with no `publish` key electron-builder
# infers a GitHub provider from the git remote, and every build carried
# `provider: github, owner: StephenGenusa, repo: DocumentConversion` in
# resources/app-update.yml. (The template's https://example.com/auto-updates,
# removed earlier, was a domain the project does not control.) `null` is the
# only value that turns publishing off. Auto-update is not configured; replace
# this with a real provider if and when it is.
publish: null
