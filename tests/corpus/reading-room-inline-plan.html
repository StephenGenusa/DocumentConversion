<h1>Finding your way around</h1>
<p>The reading room plan below shows where each collection stands. Periodicals sit beside the windows; the desk faces the entrance.</p>
<svg width="480" height="300" viewBox="0 0 480 300" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">

  <rect x="2" y="2" width="476" height="296" fill="#ffffff" stroke="#333" stroke-width="3"/>

  <text x="110" y="76" text-anchor="middle" font-size="16">Fiction</text>

  <text x="110" y="166" text-anchor="middle" font-size="16">Periodicals</text>
  <rect x="290" y="40" width="160" height="60" rx="6" fill="#dbe8f5" stroke="#2f5d8a" stroke-width="2"/>

  <rect x="290" y="170" width="110" height="50" rx="6" fill="#dbe8f5" stroke="#2f5d8a" stroke-width="2"/>
