<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Helvetica,Arial,sans-serif">
<title>Heron sync service: system architecture</title>
<defs>
  <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173f73"/><stop offset="1" stop-color="#127a85"/></linearGradient>
  <linearGradient id="service" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3eefb"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f86d6"/><stop offset="1" stop-color="#1f5fb0"/></linearGradient>
  <linearGradient id="queue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff4e0"/><stop offset="1" stop-color="#ffe0b0"/></linearGradient>
  <linearGradient id="store" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9e8d4"/><stop offset="0.5" stop-color="#f3f8f1"/><stop offset="1" stop-color="#c9ddc2"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b2a3a" flood-opacity="0.18"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2c3e50"/></marker>
  <marker id="arrow-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker>
  <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7d5c"/></marker>
</defs>
<rect width="1200" height="800" fill="#f7f9fc"/>
<g id="header"><rect width="1200" height="92" fill="url(#header)"/><rect width="1200" height="92" fill="url(#glow)"/>
<image x="28" y="14" width="64" height="64" href="data:image/png;base64,"><title>Heron logo</title></image>
<text x="110" y="46" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="start">Heron sync service: system architecture</text>
<text x="110" y="72" font-size="15" font-weight="normal" fill="#d6ecf3" text-anchor="start">How an edit travels from one device to the others</text>
</g>
<g id="lanes">
<rect x="24" y="112" width="196" height="560" rx="12" fill="#ffffff" stroke="#dbe3ec"/>
<text x="122" y="138" font-size="12" font-weight="bold" fill="#7b8a99" text-anchor="middle">CLIENTS</text>
<rect x="232" y="112" width="170" height="560" rx="12" fill="#ffffff" stroke="#dbe3ec"/>
<text x="317" y="138" font-size="12" font-weight="bold" fill="#7b8a99" text-anchor="middle">EDGE</text>
<rect x="414" y="112" width="236" height="560" rx="12" fill="#ffffff" stroke="#dbe3ec"/>
<text x="532" y="138" font-size="12" font-weight="bold" fill="#7b8a99" text-anchor="middle">SERVICES</text>
<rect x="662" y="112" width="250" height="560" rx="12" fill="#ffffff" stroke="#dbe3ec"/>
<text x="787" y="138" font-size="12" font-weight="bold" fill="#7b8a99" text-anchor="middle">EVENTS</text>
<rect x="924" y="112" width="252" height="560" rx="12" fill="#ffffff" stroke="#dbe3ec"/>
<text x="1050" y="138" font-size="12" font-weight="bold" fill="#7b8a99" text-anchor="middle">DATA</text>
</g>
<g id="client1" filter="url(#shadow)"><rect x="44" y="176" width="156" height="72" rx="10" fill="url(#service)" stroke="#3f6fa8" stroke-width="1.5"/>
<svg x="56" y="196" width="32" height="32" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="13" rx="1.5" fill="#dbe8f7" stroke="#2c4a6e" stroke-width="1.5"/><path d="M8 20 H16 M12 16 V20" stroke="#2c4a6e" stroke-width="1.5"/></svg>
<text x="96" y="218" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">Desktop app</text>
</g>
<g id="client2" filter="url(#shadow)"><rect x="44" y="296" width="156" height="72" rx="10" fill="url(#service)" stroke="#3f6fa8" stroke-width="1.5"/>
<svg x="56" y="316" width="32" height="32" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5" fill="#dbe8f7" stroke="#2c4a6e" stroke-width="1.5"/><circle cx="12" cy="18.5" r="1" fill="#2c4a6e"/></svg>
<text x="96" y="338" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">Mobile app</text>
</g>
<g id="client3" filter="url(#shadow)"><rect x="44" y="416" width="156" height="72" rx="10" fill="url(#service)" stroke="#3f6fa8" stroke-width="1.5"/>
<svg x="56" y="436" width="32" height="32" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" fill="#dbe8f7" stroke="#2c4a6e" stroke-width="1.5"/><path d="M2 8 H22" stroke="#2c4a6e" stroke-width="1.5"/><circle cx="5" cy="6" r="0.9" fill="#2c4a6e"/><circle cx="8" cy="6" r="0.9" fill="#2c4a6e"/></svg>
<text x="96" y="458" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">Web app</text>
</g>
<text x="122" y="520" font-size="11" font-weight="normal" fill="#5b6773" text-anchor="middle" font-style="italic">Edits offline, pushes when online</text>
<g id="gateway" filter="url(#shadow)"><rect x="248" y="278" width="138" height="108" rx="10" fill="url(#service)" stroke="#3f6fa8" stroke-width="1.5"/>
<text x="317" y="328" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">API gateway</text>
<text x="317" y="347" font-size="11" font-weight="normal" fill="#5b6773" text-anchor="middle">Token check, rate limits</text>
</g>
<g id="auth" filter="url(#shadow)"><rect x="434" y="168" width="196" height="84" rx="10" fill="url(#service)" stroke="#3f6fa8" stroke-width="1.5"/>
<text x="532" y="206" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Auth service</text>
<text x="532" y="225" font-size="11" font-weight="normal" fill="#5b6773" text-anchor="middle">Issues device tokens</text>
</g>
<image x="444" y="176" width="26" height="26" href="data:image/svg+xml;base64,"/>
<g id="sync" filter="url(#shadow)"><rect x="434" y="290" width="196" height="96" rx="10" fill="url(#core)" stroke="#173f73" stroke-width="1.5"/>
<text x="532" y="334" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Sync service</text>
<text x="532" y="353" font-size="11" font-weight="normal" fill="#dbe9fa" text-anchor="middle">Rebases and stores changes</text>
</g>
<g id="blob" filter="url(#shadow)"><rect x="434" y="428" width="196" height="84" rx="10" fill="url(#service)" stroke="#3f6fa8" stroke-width="1.5"/>
<text x="532" y="466" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Attachment service</text>
<text x="532" y="485" font-size="11" font-weight="normal" fill="#5b6773" text-anchor="middle">Files up to 25 MB</text>
</g>
<g id="queue" filter="url(#shadow)"><rect x="684" y="404" width="206" height="76" rx="10" fill="url(#queue)" stroke="#d97706" stroke-width="1.5"/>
<rect x="698" y="418" width="10" height="20" rx="2" fill="#f59e0b" fill-opacity="0.4"/>
<rect x="712" y="418" width="10" height="20" rx="2" fill="#f59e0b" fill-opacity="0.55"/>
<rect x="726" y="418" width="10" height="20" rx="2" fill="#f59e0b" fill-opacity="0.7"/>
<rect x="740" y="418" width="10" height="20" rx="2" fill="#f59e0b" fill-opacity="0.85"/>
<text x="762" y="434" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">Change queue</text>
<text x="787" y="464" font-size="11" font-weight="normal" fill="#7c4a03" text-anchor="middle">Topic doc.changed, kept 72 h</text>
</g>
<g id="notifier" filter="url(#shadow)"><rect x="700" y="548" width="174" height="60" rx="10" fill="#fff8ec" stroke="#d97706" stroke-width="1.5"/>
<text x="787" y="583" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Notifier</text>
</g>
<g id="indexer" filter="url(#shadow)"><rect x="700" y="168" width="174" height="64" rx="10" fill="#fff8ec" stroke="#d97706" stroke-width="1.5"/>
<text x="787" y="205" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Search indexer</text>
</g>
<g id="search" filter="url(#shadow)"><svg x="944" y="164" width="212" height="96" viewBox="0 0 212 96">
<path d="M2 14 V82 A104 12 0 0 0 210 82 V14" fill="url(#store)" stroke="#5f7d52" stroke-width="1.5"/><ellipse cx="106" cy="14" rx="104" ry="12" fill="#eef5eb" stroke="#5f7d52" stroke-width="1.5"/>
<text x="106" y="52" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Search index</text>
<text x="106" y="70" font-size="11" font-weight="normal" fill="#4d6142" text-anchor="middle">Note text</text>
</svg></g>
<g id="meta" filter="url(#shadow)"><svg x="944" y="292" width="212" height="96" viewBox="0 0 212 96">
<path d="M2 14 V82 A104 12 0 0 0 210 82 V14" fill="url(#store)" stroke="#5f7d52" stroke-width="1.5"/><ellipse cx="106" cy="14" rx="104" ry="12" fill="#eef5eb" stroke="#5f7d52" stroke-width="1.5"/>
<text x="106" y="52" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Metadata store</text>
<text x="106" y="70" font-size="11" font-weight="normal" fill="#4d6142" text-anchor="middle">Documents and revisions</text>
</svg></g>
<g id="objects" filter="url(#shadow)"><svg x="944" y="420" width="212" height="96" viewBox="0 0 212 96">
<path d="M2 14 V82 A104 12 0 0 0 210 82 V14" fill="url(#store)" stroke="#5f7d52" stroke-width="1.5"/><ellipse cx="106" cy="14" rx="104" ry="12" fill="#eef5eb" stroke="#5f7d52" stroke-width="1.5"/>
<text x="106" y="52" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Object store</text>
<text x="106" y="70" font-size="11" font-weight="normal" fill="#4d6142" text-anchor="middle">Attachments</text>
</svg></g>
