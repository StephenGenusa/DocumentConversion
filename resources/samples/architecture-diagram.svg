<path d="M786 482 L786 544" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-event)"/>
<path d="M876 200 L942 210" fill="none" stroke="#6b7d5c" stroke-width="2.4" marker-start="url(#arrow-data)" marker-end="url(#arrow-data)"/>
<path d="M698 584 C620 650 300 646 140 640 C104 638 104 574 120 528" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-event)"/>
<rect x="300" y="632" width="160" height="22" rx="11" fill="#fff4e0" stroke="#d97706"/>
<text x="380" y="647" font-size="11" font-weight="bold" fill="#7c4a03" text-anchor="middle">Push to other devices</text>
</g>
<g id="legend"><rect x="24" y="686" width="830" height="84" rx="10" fill="#ffffff" stroke="#dbe3ec"/>
<text x="44" y="710" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="start">Legend</text>
<path d="M44 736 L92 736" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
<text x="100" y="740" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">Request and reply</text>
<path d="M250 736 L298 736" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-event)"/>
<text x="306" y="740" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">Event, sent and forgotten</text>
<path d="M496 736 L544 736" stroke="#6b7d5c" stroke-width="2.4" marker-start="url(#arrow-data)" marker-end="url(#arrow-data)"/>
<text x="552" y="740" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">Reads and writes</text>
<rect x="664" y="722" width="30" height="22" rx="5" fill="url(#service)" stroke="#3f6fa8"/>
<text x="700" y="738" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">Service we run</text>
<svg x="664" y="750" width="30" height="18" viewBox="0 0 30 18"><path d="M1 4 V14 A14 3 0 0 0 29 14 V4" fill="url(#store)" stroke="#5f7d52"/><ellipse cx="15" cy="4" rx="14" ry="3" fill="#eef5eb" stroke="#5f7d52"/></svg>
<text x="700" y="764" font-size="12" font-weight="normal" fill="#1f2933" text-anchor="start">Data store</text>
</g>
<text x="1176" y="776" font-size="12" font-weight="normal" fill="#7b8a99" text-anchor="end" font-style="italic">Draft for the design review, October 2026</text>
</svg>
